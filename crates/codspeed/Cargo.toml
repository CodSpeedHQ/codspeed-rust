[package]
name = "codspeed"
version = "5.0.2"
rust-version = "1.85" # MSRV
edition = "2021"
description = "Core instrumentation library for CodSpeed"
authors = ["Arthur Pastel <arthur@codspeed.io>"]
documentation = "https://codspeed.io/docs/reference/codspeed-rust"
readme = "README.md"
repository = "https://github.com/CodSpeedHQ/codspeed-rust"
homepage = "https://codspeed.io"
license = "MIT OR Apache-2.0"
categories = [
    "development-tools",
    "development-tools::profiling",
    "development-tools::testing",
]
keywords = ["codspeed", "benchmark"]

[dependencies]
anyhow = { workspace = true }
colored = "3.0.0"
glob = "0.3.2"
libc = "^0.2"
nix = { version = "0.31.1", features = ["time"] }
getrandom = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
statrs = { version = "0.18.0", default-features = false }

opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "registry",
    "env-filter",
], optional = true }
# Unused directly: raises the floor of `sharded-slab`'s `lazy_static = "1"`, which fails to build below 1.1
lazy_static = { version = "1.1", optional = true }

[features]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:lazy_static",
]

[[bench]]
name = "native"
harness = false

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cc = "1.2.40"
